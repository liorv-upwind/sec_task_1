[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "heartbeat-service"
version = "0.1.0"
description = "Small FastAPI service used as a target repo for PR security-review evaluation."
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "pydantic-settings==2.16.1",
]

[tool.setuptools.packages.find]
# Only the application is packaged. security_fixtures/ is never installed.
include = ["app*"]
